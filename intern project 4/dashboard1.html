<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVR Dashboard</title>
    <link rel="stylesheet" href="styleboard1.css">
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <div class="logo">Beyond Visual Range</div>
            <div class="nav">Overview</div>
            <div class="nav">Objectives</div>
            <div class="nav">Timeline</div>
            <div class="nav">Replay</div>
            <div class="nav">Decision</div>
        </header>

        <!-- Main Content -->
        <div class="main">

            <!-- Left Panel -->
            <div class="left">

                <div class="card mission">
                    Mission Overview
                </div>

                <div class="card instructor">
                    Instructor Summary
                </div>

            </div>

            <!-- Center Panel -->
            <div class="center">

                <div class="map">
                    MAP
                </div>

                <div class="timeline">
                    Key Timeline
                </div>

            </div>

            <!-- Right Panel -->
            <div class="right">

                <div class="card r1">Objective Assessment</div>

                <div class="card r2">Communication Review</div>

                <div class="card r3">Performance Metrics</div>

            </div>

        </div>

        <!-- Bottom Cards -->
        <div class="bottom">

            <div class="box1">Heat Maps & Analytics</div>
            <div class="box2">Rules of Engagement</div>
            <div class="box3">Weapons Employment</div>
            <div class="box4">Report</div>

        </div>

    </div>

</body>

</html>
