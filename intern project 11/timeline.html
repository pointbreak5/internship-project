<!DOCTYPE html>
<html>

<head>
    <title>BVR Debriefing Dashboard - Timeline</title>
    <link rel="stylesheet" href="style15.css">
    <script src="index.js" defer></script>
</head>

<body>

    <div id="container">

        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px; flex-shrink: 0;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <circle cx="12" cy="12" r="6"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <line x1="12" y1="1" x2="12" y2="4"></line>
                    <line x1="12" y1="20" x2="12" y2="23"></line>
                    <line x1="1" y1="12" x2="4" y2="12"></line>
                    <line x1="20" y1="12" x2="23" y2="12"></line>
                </svg>Beyond Visual Range
            </div>
            <a href="doc15.html" class="nav">Overview</a>
            <a href="objectives.html" class="nav">Objectives</a>
            <a href="timeline.html" class="nav" id="nav-over">Timeline</a>
            <a href="replay.html" class="nav">Replay</a>
            <a href="decision.html" class="nav">Decision</a>
            <div class="header-clock" id="header-clock">
                <span class="clock-time" id="clock-time"></span>
                <span class="clock-date" id="clock-date"></span>
            </div>
        </header>
    </div>

    <!-- Timeline Page: keeping only one div on entire page (under the header) -->
    <div id="timeline-main">
        <h2>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"
                style="margin-right: 10px; flex-shrink: 0; position: relative; top: 4px;">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>Mission Timeline Events
        </h2>
        <div id="timeline-container" style="height: auto; max-height: calc(100vh - 180px); overflow-y: auto;">
            LOADING MISSION TIMELINE...
        </div>
    </div>

</body>

</html>
